<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Werkbot OG source</title>
<style>
@font-face{font-family:"Inter";src:url(/assets/fonts/inter.woff2) format("woff2");font-weight:100 900}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#f7f7f9;font-family:Inter,sans-serif;color:#0b0b0f;padding:72px 80px;position:relative;overflow:hidden}
.logo{display:flex;align-items:center;gap:16px;font-size:32px;font-weight:600}
.logo svg{width:56px;height:56px}
h1{font-size:96px;line-height:1.04;font-weight:600;letter-spacing:-.035em;margin-top:120px;max-width:900px}
.pill{position:absolute;left:80px;bottom:72px;display:flex;align-items:center;gap:12px;height:48px;padding:0 24px;border-radius:999px;background:#fff;border:1px solid rgba(11,11,15,.14);font-size:24px;font-weight:500}
.pill i{width:12px;height:12px;border-radius:50%;background:#2F5BEA}
.url{position:absolute;right:80px;bottom:80px;font-size:24px;color:#454955}
.ring{position:absolute;right:80px;top:72px;width:96px;height:96px}
</style></head><body>
<div class="logo"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="#2F5BEA"/><path d="M9.5 13 L14.5 27 L20 16.5 L25.5 27 L30.5 13" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Werkbot</div>
<svg class="ring" viewBox="0 0 56 56"><circle cx="28" cy="28" r="25" fill="none" stroke="rgba(11,11,15,.1)" stroke-width="3"/><circle cx="28" cy="28" r="25" fill="none" stroke="#0b0b0f" stroke-width="3" stroke-linecap="round" stroke-dasharray="147.6 157.1" transform="rotate(-90 28 28)"/><text x="28" y="33" text-anchor="middle" font-size="15" font-weight="600" font-family="Inter" fill="#0b0b0f">94%</text></svg>
<h1>Paste a job link. Press Send.</h1>
<div class="pill"><i></i>Launching soon</div>
<div class="url">werkbot.xyz</div>
</body></html>
